[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-collision-guardrail"
version = "0.1.0"
description = "RGB-only collision guardrail for mobile robots."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "reactivex>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
include = ["dimos*"]

[tool.pytest.ini_options]
testpaths = ["dimos/control/safety"]
pythonpath = ["."]
markers = [
    "slow: timing-sensitive integration tests (excluded from the CI gate)",
]
